<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdaptiveGuard – Live Agent</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fb;--card:#fff;--tx:#14162b;--mut:#646a88;--bd:#e2e5f1;--ac:#6d5efc;--ac2:#00bfa5;--ok:#16a34a;--bad:#e11d48;--warn:#d97706;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b1a;--card:#13152c;--tx:#eef0ff;--mut:#9a9fc4;--bd:#262a4d;--ac:#8b7dff;--ac2:#2ee6c5;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b1a;--card:#13152c;--tx:#eef0ff;--mut:#9a9fc4;--bd:#262a4d;--ac:#8b7dff;--ac2:#2ee6c5;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
body:before{content:"";position:fixed;inset:0 0 auto;height:320px;background:radial-gradient(circle at 25% 0,var(--ac) 0,transparent 55%),radial-gradient(circle at 80% 0,var(--ac2) 0,transparent 50%);opacity:.18;pointer-events:none}
.w{max-width:1000px;margin:0 auto;padding:22px 16px 48px;position:relative}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 4px;letter-spacing:-1px}
.g{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--mut);margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:70px;border:1px solid var(--bd);border-radius:12px;padding:11px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:active{border-color:var(--ac)}
.r{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;font-size:14px}
.go{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:11px 24px;font:600 15px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 22px rgba(109,94,252,.3)}
button:disabled{opacity:.5}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ph{margin:0 0 10px;font-size:16px}
.ad{border-color:var(--ac2);box-shadow:0 0 0 1px var(--ac2) inset}
.st{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;opacity:.55;transition:.25s}
.st.run,.st.ok,.st.bad,.st.wait{opacity:1}
.d{width:26px;height:26px;border-radius:50%;background:var(--bd);color:var(--mut);display:grid;place-items:center;font-size:13px;flex:none}
.bx{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hd b{font-size:14.5px}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700}
.r-low{background:rgba(22,163,74,.16);color:var(--ok)}
.r-medium{background:rgba(0,191,165,.18);color:var(--ac2)}
.r-high{background:rgba(109,94,252,.2);color:var(--ac)}
.r-critical{background:rgba(217,119,6,.2);color:var(--warn)}
.m{font-size:12.5px;color:var(--mut)}
.o{font-size:12.5px;margin-top:3px;word-break:break-word}
.st.run{border-color:var(--ac)}.st.run .d{background:var(--ac);color:#fff}
.st.ok{border-color:var(--ok)}.st.ok .d{background:var(--ok);color:#fff}
.st.bad{border-color:var(--bad)}.st.bad .d{background:var(--bad);color:#fff}
.st.wait{border-color:var(--warn)}.st.wait .d{background:var(--warn);color:#fff}
.ap{margin:6px 6px 0 0;border:0;border-radius:8px;padding:6px 14px;color:#fff;font-weight:600;cursor:pointer}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.met div{background:var(--bg);border-radius:10px;padding:7px;text-align:center}
.met b{display:block;font-size:20px}.met span{font-size:11px;color:var(--mut)}
.note{background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--mut)}
#sum{display:none;text-align:center;border-color:var(--ac2)}
#sum b{font-size:22px}
.log{font:12px ui-monospace,Menlo,monospace;color:var(--mut);max-height:140px;overflow:auto;white-space:pre-wrap}
</style></head><body><div class="w">
<h1><span class="g">AdaptiveGuard</span></h1>
<p class="s">Give any task: the plan, risk levels and checks are built from it. Two agents run it side by side.</p>
<div class="c">
<div class="chips" id="chips"></div>
<textarea id="req"></textarea>
<div class="r">
<label><input type="checkbox" id="inj" checked> Inject a mistake into a key step</label>
<label id="lw" hidden><input type="checkbox" id="live" checked> Use live Claude</label>
<button class="go" id="go">▶ Run both agents</button></div>
<div class="note" id="warn" style="margin-top:10px" hidden>Live Claude isn’t enabled for this page, so the built-in task-aware planner was used instead.</div>
</div>
<div class="two">
<div class="c"><h3 class="ph">🐢 Check every step</h3><div id="p1"></div><div class="met" id="m1"></div></div>
<div class="c ad"><h3 class="ph">⚡ AdaptiveGuard</h3><div id="p2"></div><div class="met" id="m2"></div></div>
</div>
<div class="c" id="sum"><b class="g" id="sv"></b><div class="s" id="sd" style="margin:4px 0 0"></div></div>
<div class="c"><b style="font-size:14px">Log</b><div class="log" id="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),J=JSON.stringify,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PRE=["Plan a trip to Madurai from 12 Nov to 14 Nov 2026 for 2 people, budget ₹15000, and book it.","Process this month’s expense reports: total all claims, flag claims above ₹5000, and email the finance team the summary.","Clean the customer database: remove duplicates, fix phone formats, and permanently delete inactive accounts.","Order 50 laptops for the new office within a ₹40 lakh budget and pay the vendor."];
const LB=["✈️ Trip booking","🧾 Expense reports","🗄️ Database cleanup","💻 Laptop order"];
PRE.forEach((p,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=LB[i];b.onclick=()=>{$("req").value=p};$("chips").appendChild(b)});
$("req").value=PRE[0];
let sample=null,busy=false;
(window.claude&&claude.use?claude.use("sample"):Promise.resolve(null)).then(s=>{sample=s;if(s)$("lw").hidden=false}).catch(()=>{});
const log=t=>{const l=$("log");l.textContent+=t+"\n";l.scrollTop=l.scrollHeight};
const FREE={calls:0,ms:0};
async function ask(st,p){const t=Date.now();st.calls++;st.upd&&st.upd();try{return await sample.json("Reply with one JSON object only, no prose.\n"+p,{modelTier:"quick",cache:false})}finally{st.ms+=Date.now()-t;st.upd&&st.upd()}}
function mkRows(id,plan){const b=$(id);b.innerHTML="";return plan.map((s,i)=>{const e=document.createElement("div");e.className="st";e.innerHTML='<div class="d"></div><div class="bx"><div class="hd"><b></b><span class="tag"></span></div><div class="m"></div><div class="o"></div></div>';e.querySelector(".d").textContent=i+1;e.querySelector("b").textContent=s.name;const t=e.querySelector(".tag");t.textContent=s.risk+" risk";t.className="tag r-"+s.risk;b.appendChild(e);return e})}
const mk=(e,cls,msg,dot)=>{e.className="st "+cls;e.querySelector(".m").textContent=msg||"";if(dot)e.querySelector(".d").textContent=dot};
const showO=(e,o)=>{e.querySelector(".o").textContent=o};
function approve(e,name){return new Promise(r=>{mk(e,"wait","Waiting for you: approve “"+name+"”?","!");const b=document.createElement("div");[["Approve","var(--ok)",1],["Reject","var(--bad)",0]].forEach(([t,c,v])=>{const k=document.createElement("button");k.className="ap";k.style.background=c;k.textContent=t;k.onclick=()=>{b.remove();r(v)};b.appendChild(k)});e.querySelector(".bx").appendChild(b)})}
const PS=[
[["Understand request","low","Destination Madurai, 12–14 Nov 2026 (2 nights), 2 people, budget ₹15,000."],["Select dates","high","Dates confirmed: depart 12 Nov, return 14 Nov 2026, 2 nights.","Dates confirmed: depart 12 Nov, return 19 Nov 2026, 7 nights.","14 Nov","Return date 19 Nov contradicts the requested 14 Nov"],["Search flights","medium","Chennai to Madurai flights for 2 found, ₹6,400 return in total."],["Select hotel","medium","Hotel booked for 2 nights at ₹3,800 per night, total ₹7,600."],["Make payment","critical","Payment of ₹14,000 charged for flights and hotel."]],
[["Read claims","low","Loaded 42 expense claims for October from the finance sheet."],["Total and flag","high","Total ₹3,18,400; 6 claims above ₹5,000 flagged.","Total ₹3,81,400; 6 claims above ₹5,000 flagged.","3,18,400","Total does not match the sum of the 42 claims (₹3,18,400)"],["Draft summary","medium","Summary drafted with total, 6 flagged claims and top 3 categories."],["Pick recipients","medium","Recipients: finance team list, CC the accounts manager."],["Send email","critical","Email sent to the finance team with the summary attached."]],
[["Scan database","low","Scanned 12,480 customer records."],["Find duplicates","high","Found 312 duplicate records and 96 inactive accounts (no login for 24 months).","Found 312 duplicate records and 960 inactive accounts (no login for 24 months).","96 inactive","Inactive count is inflated: only 96 accounts meet the 24-month rule"],["Fix phone formats","medium","Normalized 1,840 phone numbers to +91 format."],["Back up data","medium","Snapshot of all affected records saved before any change."],["Delete permanently","critical","Deleted 312 duplicates and 96 inactive accounts permanently."]],
[["Understand order","low","Need 50 laptops, budget ₹40,00,000, single vendor."],["Compute budget","high","Budget per laptop ₹80,000 (₹40,00,000 ÷ 50).","Budget per laptop ₹1,20,000 (₹40,00,000 ÷ 50).","₹80,000","₹40,00,000 ÷ 50 is ₹80,000, not ₹1,20,000"],["Compare vendors","medium","Shortlisted 3 vendors; best offer ₹76,500 per laptop."],["Get quote","medium","Quote: 50 × ₹76,500 = ₹38,25,000 including warranty."],["Pay vendor","critical","Payment of ₹38,25,000 sent to the selected vendor."]]];
const MU={lakh:1e5,lakhs:1e5,lac:1e5,crore:1e7,cr:1e7,k:1e3},MO="jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec";
const money=P=>{const m=P.match(/(?:₹|rs\.?\s?|inr\s?)\s*([\d,]+(?:\.\d+)?)\s*(lakhs?|lac|crore|cr|k)?\b|\b([\d,]+(?:\.\d+)?)\s*(lakhs?|lac|crore|cr|k)\b/i);return m?parseFloat((m[1]||m[3]).replace(/,/g,""))*(MU[(m[2]||m[4]||"").toLowerCase()]||1):0};
const inr=v=>"₹"+Math.round(v).toLocaleString("en-IN");
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const cnt=P=>{const m=P.replace(/(?:₹|rs\.?\s?)\s*[\d,]+\s*(?:lakhs?|crore|k)?/ig,"").match(new RegExp("\\b(\\d{1,4})\\s+(?!(?:for|to|and|the|from|with|by|in|on|at|of|"+MO+"|lakh|crore|k)\\b)([a-z]{3,})","i"));return m&&(m[1]<1990||m[1]>2100)?[+m[1],m[2]]:null};
const DT=new RegExp("\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?:"+MO+")[a-z]*(?:\\s+\\d{4})?","ig");
const DOM=[
[/delete|remove|clean|purge|erase|wipe|archive|database|records/i,"Scan data","Scanned the records and listed the ones that match the task","Back up data","Snapshot of every affected record saved before any change","Apply changes","Changes applied permanently to the selected records"],
[/trip|travel|flight|hotel|tour|stay|vacation/i,"Search options","Compared flight, stay and transport options that fit the task","Select bookings","Best-value options selected and held for confirmation","Book and pay","Bookings confirmed and payment charged"],
[/order|buy|purchase|procure|vendor|supplier/i,"Compare vendors","Shortlisted 3 vendors and compared price, warranty and delivery","Get quote","Final quote received and checked against the requirement","Place order and pay","Order placed and payment sent to the selected vendor"],
[/deploy|release|ship|migrate|production|server|code|push/i,"Review changes","Reviewed the changes and listed what will be affected","Run tests","Test suite and staging checks completed successfully","Deploy to production","Release deployed to production and monitored"],
[/hire|recruit|candidate|interview|onboard|offer/i,"Shortlist people","Profiles screened and a shortlist prepared","Prepare offer","Offer details and schedule prepared for approval","Send offer","Offer sent to the selected candidate"],
[/pay|invoice|salary|payroll|refund|transfer|reimburse|bill/i,"Verify details","Payee, invoice and bank details verified","Prepare payment","Payment batch prepared and matched with invoices","Release payment","Payment released to the payees"],
[/event|offsite|venue|organi[sz]e|wedding|party|conference|meeting|schedule|seminar|workshop/i,"Check availability","Venue, vendors and people availability checked","Prepare plan","Agenda, bookings and responsibilities prepared","Confirm and notify","Everything confirmed and invitations sent"],
[/email|mail|send|notify|announce|newsletter|message|invite/i,"Collect content","Source details and recipient list collected","Draft message","Message drafted with key points, tone and attachments","Send message","Message sent to all selected recipients"]];
const DEF=["Gather details","Relevant details and constraints collected","Prepare action","Final action prepared and double-checked against the plan","Execute action","Action executed as planned"];
const GEN=P=>{
 const t=P.length>50?P.slice(0,50)+"…":P,v=money(P),c=cnt(P),ds=P.match(DT)||[],d=DOM.find(x=>x[0].test(P))||[0,...DEF],ok=Math.round(v*.92);
 const f=[v?"budget "+inr(v):"",c?c[0]+" "+c[1]:"",ds.length?ds.join(" to "):""].filter(Boolean);
 const k=v?["Check budget","Planned spend "+inr(ok)+" stays within the "+inr(v)+" limit.","Planned spend "+inr(v*1.18)+" stays within the "+inr(v)+" limit.",esc(inr(ok)),"Planned spend is above the "+inr(v)+" limit"]
  :c?["Confirm quantity","Quantity confirmed: "+c[0]+" "+c[1]+" as requested.","Quantity confirmed: "+c[0]*10+" "+c[1]+" as requested.","\\b"+c[0]+" "+esc(c[1]),"Quantity differs from the "+c[0]+" "+c[1]+" requested"]
  :["Validate plan","Plan stays within the limits stated in the task.","Plan ignores the limits stated in the task.","within the limits","Output ignores the constraints stated in the task"];
 return [["Understand request","low",f.length?"Understood “"+t+"” · "+f.join(" · ")+".":"Task understood: “"+t+"”."],
 [d[1],"medium",d[2]+(c?" for "+c[0]+" "+c[1]:"")+"."],
 [k[0],"high",k[1],k[2],k[3],k[4]],
 [d[3],"medium",d[4]+"."],
 [d[5],"critical",d[6]+(ds.length?" ("+ds.join(" to ")+")":"")+"."]]};
const planOff=P=>{const i=PRE.indexOf(P),a=i>=0?PS[i]:GEN(P);return a.map(r=>({name:r[0],risk:r[1],out:r[2],bad:r[3]||r[2]+" (unchecked)",key:new RegExp(r[4]||"."),why:r[5]||"rejected"}))};
const LIVE=()=>!!(sample&&$("live").checked);
async function off(st,ms,v,free){if(!free){st.calls++;st.upd&&st.upd()}await sleep(ms);st.ms+=ms;st.upd&&st.upd();return v}
async function offB(st,idx,plan,out){await off(st,1200);return{results:idx.map(i=>({step:i+1,ok:plan[i].key.test(out[i].output),reason:plan[i].why}))}}
const rule=o=>!o||o.length<15||/undefined|null|NaN|error/i.test(o)?"empty or malformed output":"";
const gen=async(st,P,s,out,fb)=>{if(!LIVE())return off(st,500,s.out,1);const k=await ask(st,`Task: ${P}\nCompleted steps: ${J(out.filter(Boolean))}\nNow do this step: "${s.name}". Give a concrete result with specific numbers and dates where relevant. Return {"output":string (max 2 sentences)}.${fb}`);st.calls--;st.upd&&st.upd();return String(k.output||"")};
const corrupt=async(o,s)=>{if(!LIVE())return s.bad;const k=await ask(FREE,`Original step output: "${o}"\nRewrite it with ONE subtle but important mistake (a wrong number, date or logic slip). Return {"output":string}`);return String(k.output||o)};
const deep=async(st,P,s,o,out)=>{if(!LIVE()){await off(st,1200);return s.key.test(o)?"":s.why}const k=await ask(st,`Task: ${P}\nStep: ${s.name}\nOutput: ${o}\nEarlier outputs: ${J(out)}\nIs the output correct and consistent with the task and earlier outputs, with no factual or logical mistake? Return {"ok":boolean,"reason":string}`);return k.ok?"":(k.reason||"rejected")};
async function pipe(mode,P,plan,id,mid,inj,ti){
 const ad=mode==="ad",R=mkRows(id,plan),out=[],st={calls:0,ms:0,caught:0,human:0};let pend=[],fail=false;
 st.upd=()=>{$(mid).innerHTML=[[st.calls,"AI checks"],[(st.ms/1000).toFixed(1)+"s","time"],[st.caught,"caught"],[st.human,"human"]].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")};st.upd();
 const fix=async(i,why)=>{mk(R[i],"bad","Caught: "+why,"✗");st.caught++;log(`[${ad?"Adaptive":"Baseline"}] caught step ${i+1}: ${why}`);st.upd();await sleep(800);mk(R[i],"run","Fixing only this step…");const o=await gen(st,P,plan[i],out,"\nYour previous answer was rejected: "+why+". Fix it.");out[i]={step:plan[i].name,output:o};showO(R[i],o)};
 const flush=async()=>{if(!pend.length)return;const idx=pend;pend=[];idx.forEach(i=>mk(R[i],"run","Batch checking together…"));
  const k=!LIVE()?await offB(st,idx,plan,out):await ask(st,`Task: ${P}\nCheck these step outputs together: ${J(idx.map(i=>({step:i+1,name:plan[i].name,output:out[i].output})))}\nEarlier outputs: ${J(out.filter(Boolean))}\nReturn {"results":[{"step":number,"ok":boolean,"reason":string}]}`);
  const res=k.results||[];for(const i of idx){const r=res.find(x=>x.step===i+1);let f=false;if(r&&r.ok===false){await fix(i,r.reason||"rejected");f=true}mk(R[i],"ok",f?"Fixed in place ✓":"Batch verified (1 shared call)","✓")}};
 try{
 for(let i=0;i<plan.length&&!fail;i++){const s=plan[i];mk(R[i],"run","Working…");
  let o=await gen(st,P,s,out,"");
  if(inj&&i===ti){o=await corrupt(o,s);log(`⚠ Mistake injected into step ${i+1} (${s.name})`)}
  out[i]={step:s.name,output:o};showO(R[i],o);
  const lvl=ad?s.risk:"high";
  if(lvl==="low"){mk(R[i],"run","Rule check…");const e=rule(o);if(e)await fix(i,e);mk(R[i],"ok","Rule check passed · 0 AI calls","✓")}
  else if(lvl==="medium"){pend.push(i);mk(R[i],"run","Queued for batch check…")}
  else{await flush();mk(R[i],"run","Deep AI check…");const e=await deep(st,P,s,o,out.slice(0,i));let f=false;if(e){await fix(i,e);f=true}
   if(ad&&s.risk==="critical"){const okk=await approve(R[i],s.name);st.human++;st.upd();if(!okk){mk(R[i],"bad","You rejected this action","✗");fail=true;continue}mk(R[i],"ok","Approved by you · executed","✓")}
   else mk(R[i],"ok",f?"Fixed in place ✓":"Deep check passed","✓")}
 }
 if(!fail)await flush();
 }catch(e){log("Error: "+(e&&e.message||e));if(e&&e.code==="not_granted")($("warn").hidden=false,$("live").checked=false)}
 st.upd();return st}
async function probe(){if(!LIVE())return;try{await sample.json('Reply with the JSON {"ok":true}',{modelTier:"quick",cache:false})}catch(e){$("warn").hidden=false;$("live").checked=false}}
async function run(){
 if(busy)return;busy=true;$("go").disabled=true;$("sum").style.display="none";$("log").textContent="";FREE.calls=0;
 const P=$("req").value.trim(),inj=$("inj").checked;
 try{
  if(!P)throw new Error("Type a task first");await probe();$("p1").textContent="Planning…";$("p2").textContent="";
  const k=!LIVE()?{steps:planOff(P)}:await ask(FREE,`Task: ${P}\nBreak it into exactly 5 sequential steps. Rate each step risk: "low" (reading or understanding), "medium" (searching, selecting, drafting), "high" (calculations or decisions later steps depend on), "critical" (irreversible: payment, sending, permanent delete; only the last step). Return {"steps":[{"name":string (max 4 words),"risk":"low"|"medium"|"high"|"critical"}]}`);
  let plan=(k.steps||[]).slice(0,5).map(s=>({...s,name:String(s.name||"Step"),risk:["low","medium","high","critical"].includes(s.risk)?s.risk:"medium"}));
  if(plan.length<3)throw new Error("Could not plan this task, try again");
  plan[plan.length-1].risk="critical";plan.slice(0,-1).forEach(s=>{if(s.risk==="critical")s.risk="high"});
  if(!plan.some(s=>s.risk==="high"))plan[1].risk="high";
  const ti=plan.findIndex(s=>s.risk==="high");
  log((LIVE()?"Live plan: ":"Offline plan: ")+plan.map(s=>s.name+" ("+s.risk+")").join(" → "));
  const [a,b]=await Promise.all([pipe("full",P,plan,"p1","m1",inj,ti),pipe("ad",P,plan,"p2","m2",inj,ti)]);
  const dc=Math.round((1-b.calls/a.calls)*100),dt=Math.round((1-b.ms/a.ms)*100);
  $("sv").textContent=`${dc}% fewer AI checks · ${dt}% faster`;
  $("sd").textContent=`Baseline: ${a.calls} calls, ${(a.ms/1000).toFixed(1)}s. AdaptiveGuard: ${b.calls} calls, ${(b.ms/1000).toFixed(1)}s, plus human approval on the critical step.`;
  $("sum").style.display="block";
 }catch(e){log("Error: "+(e&&e.message||e));if(e&&e.code==="not_granted")($("warn").hidden=false,$("live").checked=false)}
 busy=false;$("go").disabled=false}
$("go").onclick=run;
</script></body></html>
